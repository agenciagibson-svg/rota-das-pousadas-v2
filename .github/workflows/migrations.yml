# Aplica as migrations do Supabase em produção, sem digitar senha.
#
# A senha do banco fica guardada uma vez no segredo SUPABASE_DB_URL do
# repositório (Settings → Secrets and variables → Actions). Vale só a senha ou
# a URL inteira: `scripts/montar-db-url.py` monta a conexão pelo "Session
# pooler" (o GitHub não alcança db.<ref>.supabase.co, que é só IPv6).
#
# Só roda pelo botão (Actions → "Migrations do banco" → Run workflow) ou por
# `gh workflow run migrations.yml`. Nunca roda sozinho num push: o plano Free
# não tem backup, então cada aplicação é uma decisão.
name: Migrations do banco

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular = só lista o que falta; aplicar = grava no banco de produção'
        type: choice
        options: [simular, aplicar]
        default: simular

concurrency:
  group: migrations-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Montar a conexão
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/montar-db-url.py

      - name: O que falta aplicar
        run: supabase db push --db-url "$DB_URL" --dry-run

      - name: Aplicar
        if: ${{ inputs.modo == 'aplicar' }}
        run: supabase db push --db-url "$DB_URL" --yes
